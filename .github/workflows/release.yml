name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: continuous-release/.github/.github/workflows/auto-release.yml@main
    with:
      # Nx is the canonical release build: it uses the runner's cargo and
      # Python, so the Rust binary links against the runner's glibc and is
      # portable to the release-verify job and to users.
      system: node
      toolkit-ref: v0.3.2
      setup-command: npm ci
      test-command: |
        set -euo pipefail
        node scripts/codegen.mjs --check
        npm --prefix ts test
        PYTHONPATH=python/src python3 -m unittest discover -s python/tests
        cargo test --offline --manifest-path rust/Cargo.toml
      build-command: |
        set -euo pipefail
        rm -rf dist
        RELEASE_VERSION="$VERSION" npx nx run polyglot:finalize --skip-nx-cache
      artifact-glob: dist/*

  verify:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify the tag points at this commit
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"

      - name: Download the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist

      - name: Verify the manifest and artifacts
        run: node scripts/verify.mjs --dist dist
